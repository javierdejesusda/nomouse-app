<!doctype html>
<!--
  builder-made test page for NoMouse. Copyright (c) 2026 javierdejesusda.
  MIT License (see LICENSE at the repository root).
  Pattern: Tab order, failing variant. The formatting toolbar is drawn with
  `flex-direction: row-reverse`, so the buttons read Bold, Italic, Underline,
  Link from left to right but Tab visits them from right to left.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Write a post (builder-made)</title>
<style>
  body { margin: 0; font: 16px/1.5 system-ui, sans-serif; color: #1d1d1f; background: #fafafa; }
  .badge { display: block; padding: 4px 16px; background: #fff3c4; border-bottom: 1px solid #e0c868; font-size: 14px; }
  header { display: flex; gap: 24px; align-items: center; padding: 12px 16px; background: #fff; border-bottom: 1px solid #ddd; }
  header strong { margin-right: auto; }
  main { padding: 24px 16px; max-width: 760px; }
  .field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 20px; }
  input, textarea { font: inherit; padding: 8px; }
  textarea { height: 200px; }
  .toolbar { display: flex; flex-direction: row-reverse; justify-content: flex-end; gap: 8px; margin-bottom: 8px; }
  .toolbar button { min-width: 88px; }
  button { font: inherit; padding: 6px 12px; }
  button[aria-pressed="true"] { background: #dbe8ff; }
  .actions { display: flex; gap: 12px; margin-top: 16px; }
  :focus { outline: 2px solid #1a5fd0; outline-offset: 2px; }
</style>
</head>
<body>
<span class="badge">builder-made test page (MIT)</span>
<header>
  <strong>Field notes</strong>
  <a href="#drafts">Drafts</a>
  <a href="#published">Published</a>
</header>
<main>
  <div class="field">
    <label for="title">Title</label>
    <input id="title" type="text">
  </div>
  <div class="toolbar" role="toolbar" aria-label="Formatting">
    <button id="btn-link" type="button" aria-pressed="false">Link</button>
    <button id="btn-underline" type="button" aria-pressed="false">Underline</button>
    <button id="btn-italic" type="button" aria-pressed="false">Italic</button>
    <button id="btn-bold" type="button" aria-pressed="false">Bold</button>
  </div>
  <label for="body" class="field">Body</label>
  <textarea id="body"></textarea>
  <div class="actions">
    <a href="#preview">Preview</a>
    <a href="#publish">Publish</a>
  </div>
</main>
<script>
  for (const button of document.querySelectorAll(".toolbar button")) {
    button.addEventListener("click", () => {
      const pressed = button.getAttribute("aria-pressed") === "true";
      button.setAttribute("aria-pressed", String(!pressed));
    });
  }
</script>
</body>
</html>
