<!doctype html>
<!--
  builder-made test page for NoMouse. Copyright (c) 2026 javierdejesusda.
  MIT License (see LICENSE at the repository root).
  Pattern: Tab order, failing variant. The password field comes before the
  email field in the source and CSS `order` draws email first, so Tab moves
  up from Password to Email.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in to Ledger (builder-made)</title>
<style>
  body { margin: 0; font: 16px/1.5 system-ui, sans-serif; color: #1d1d1f; background: #f3f5f8; }
  .badge { display: block; padding: 4px 16px; background: #fff3c4; border-bottom: 1px solid #e0c868; font-size: 14px; }
  header { display: flex; gap: 24px; align-items: center; padding: 12px 16px; background: #fff; border-bottom: 1px solid #ddd; }
  header strong { margin-right: auto; }
  main { display: flex; justify-content: center; padding: 48px 16px; }
  form { display: flex; flex-direction: column; gap: 20px; width: 360px; padding: 24px; background: #fff; border: 1px solid #ddd; border-radius: 8px; }
  h1 { margin: 0; font-size: 24px; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field-email { order: -1; }
  h1 { order: -2; }
  input { font: inherit; padding: 8px; }
  button { font: inherit; padding: 8px 12px; }
  footer { text-align: center; padding: 16px; font-size: 14px; }
  :focus { outline: 2px solid #1a5fd0; outline-offset: 2px; }
</style>
</head>
<body>
<span class="badge">builder-made test page (MIT)</span>
<header>
  <strong>Ledger</strong>
  <a href="#pricing">Pricing</a>
  <a href="#help">Help</a>
</header>
<main>
  <form action="#" onsubmit="return false">
    <h1>Sign in</h1>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password">
    </div>
    <div class="field field-email">
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="email">
    </div>
    <a href="#reset">Forgot your password?</a>
    <button id="sign-in" type="submit">Sign in</button>
  </form>
</main>
<footer>
  <a href="#privacy">Privacy</a>
</footer>
</body>
</html>
