<!doctype html>
<!--
  builder-made test page for NoMouse. Copyright (c) 2026 javierdejesusda.
  MIT License (see LICENSE at the repository root).
  Pattern: modal dialog, failing variant. Enter on "Invite people" shows the
  dialog (it was display: none), but focus stays on the button behind it.
  Escape closes the dialog and focus is still on the button.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Team members (builder-made)</title>
<style>
  body { margin: 0; font: 16px/1.5 system-ui, sans-serif; color: #1d1d1f; background: #fafafa; }
  .badge { display: block; padding: 4px 16px; background: #fff3c4; border-bottom: 1px solid #e0c868; font-size: 14px; }
  header { display: flex; gap: 24px; align-items: center; padding: 12px 16px; background: #fff; border-bottom: 1px solid #ddd; }
  header strong { margin-right: auto; }
  main { padding: 16px; max-width: 760px; }
  .bar { display: flex; justify-content: space-between; align-items: center; }
  table { width: 100%; border-collapse: collapse; background: #fff; }
  th, td { text-align: left; padding: 8px; border-bottom: 1px solid #e3e3e3; }
  button { font: inherit; padding: 6px 12px; }
  input, select { font: inherit; padding: 6px 8px; }
  .scrim { position: fixed; inset: 0; background: rgba(20, 20, 30, .4); }
  [role="dialog"] { position: fixed; top: 120px; left: 50%; width: 420px; margin-left: -210px; padding: 24px; background: #fff; border-radius: 8px; box-sizing: border-box; }
  [role="dialog"] h2 { margin: 0 0 12px; font-size: 20px; }
  .field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
  .actions { display: flex; gap: 12px; justify-content: flex-end; }
  [hidden] { display: none; }
  :focus { outline: 2px solid #1a5fd0; outline-offset: 2px; }
</style>
</head>
<body>
<span class="badge">builder-made test page (MIT)</span>
<header>
  <strong>Clinic rota</strong>
  <a href="#schedule">Schedule</a>
  <a href="#members">Members</a>
</header>
<main id="members">
  <div class="bar">
    <h1>Team members</h1>
    <button id="invite" type="button" aria-haspopup="dialog">Invite people</button>
  </div>
  <table>
    <thead><tr><th>Name</th><th>Role</th><th>Profile</th></tr></thead>
    <tbody>
      <tr><td>Ana Ruiz</td><td>Nurse</td><td><a href="#ana">View</a></td></tr>
      <tr><td>Ben Okafor</td><td>Doctor</td><td><a href="#ben">View</a></td></tr>
      <tr><td>Chen Li</td><td>Reception</td><td><a href="#chen">View</a></td></tr>
    </tbody>
  </table>
</main>
<div id="invite-layer" hidden>
  <div class="scrim"></div>
  <div id="invite-dialog" role="dialog" aria-modal="true" aria-labelledby="invite-title">
    <h2 id="invite-title">Invite people</h2>
    <div class="field"><label for="invite-email">Email addresses</label><input id="invite-email" type="email"></div>
    <div class="field">
      <label for="invite-role">Role</label>
      <select id="invite-role"><option>Nurse</option><option>Doctor</option><option>Reception</option></select>
    </div>
    <div class="actions">
      <button id="invite-cancel" type="button">Cancel</button>
      <button id="invite-send" type="button">Send invites</button>
    </div>
  </div>
</div>
<script>
  const trigger = document.getElementById("invite");
  const layer = document.getElementById("invite-layer");
  // The failure under test: the dialog opens but focus is never moved into it.
  trigger.addEventListener("click", () => { layer.hidden = false; });
  document.getElementById("invite-cancel").addEventListener("click", () => {
    layer.hidden = true;
    trigger.focus();
  });
  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape" && !layer.hidden) {
      layer.hidden = true;
      trigger.focus();
    }
  });
</script>
</body>
</html>
