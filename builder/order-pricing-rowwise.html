<!doctype html>
<!--
  builder-made test page for NoMouse. Copyright (c) 2026 javierdejesusda.
  MIT License (see LICENSE at the repository root).
  Pattern: Tab order, failing variant (after WCAG F44). Three plan cards are
  drawn side by side, each with a seats field and its own Choose button, but
  their parts sit on a shared grid written row by row. Tab goes from the
  Basic seats field to the Pro and Team seats fields before reaching Choose
  Basic, so the task inside each card is broken. Each step moves right on
  the same row or down, never up.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plans and pricing (builder-made)</title>
<style>
  body { margin: 0; font: 16px/1.5 system-ui, sans-serif; color: #1d1d1f; background: #f4f4f7; }
  .badge { display: block; padding: 4px 16px; background: #fff3c4; border-bottom: 1px solid #e0c868; font-size: 14px; }
  header { display: flex; gap: 24px; align-items: center; padding: 12px 16px; background: #fff; border-bottom: 1px solid #ddd; }
  header strong { margin-right: auto; }
  main { padding: 24px 16px; max-width: 900px; }
  h1 { font-size: 28px; margin: 0 0 16px; }
  .plans { display: grid; grid-template-columns: repeat(3, 1fr); column-gap: 24px; }
  .part { background: #fff; padding: 8px 20px; border-left: 1px solid #ccd; border-right: 1px solid #ccd; }
  .part.name { border-top: 1px solid #ccd; border-radius: 10px 10px 0 0; padding-top: 20px; }
  .part.name h2 { margin: 0; font-size: 20px; }
  .part.price { font-size: 28px; font-weight: 600; }
  .part.price small { font-size: 14px; font-weight: 400; }
  .part.seats label { display: block; font-size: 14px; }
  .part.seats input { font: inherit; width: 5em; padding: 4px 8px; }
  .part.choose { border-bottom: 1px solid #ccd; border-radius: 0 0 10px 10px; padding-bottom: 20px; padding-top: 16px; }
  .part.choose button { font: inherit; padding: 8px 16px; background: #1a5fd0; color: #fff; border: 0; border-radius: 6px; }
  .vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  :focus { outline: 2px solid #c2410c; outline-offset: 2px; }
</style>
</head>
<body>
<span class="badge">builder-made test page (MIT)</span>
<header>
  <strong>Inkwell</strong>
  <a href="#product">Product</a>
  <a href="#customers">Customers</a>
</header>
<main>
  <h1>Pick a plan</h1>
  <div class="plans">
    <div class="part name"><h2>Basic</h2></div>
    <div class="part name"><h2>Pro</h2></div>
    <div class="part name"><h2>Team</h2></div>
    <div class="part price">$4 <small>per seat per month</small></div>
    <div class="part price">$12 <small>per seat per month</small></div>
    <div class="part price">$30 <small>per seat per month</small></div>
    <div class="part seats"><label for="seats-basic">Seats<span class="vh"> for Basic</span></label><input id="seats-basic" type="number" min="1" value="1"></div>
    <div class="part seats"><label for="seats-pro">Seats<span class="vh"> for Pro</span></label><input id="seats-pro" type="number" min="1" value="1"></div>
    <div class="part seats"><label for="seats-team">Seats<span class="vh"> for Team</span></label><input id="seats-team" type="number" min="1" value="1"></div>
    <div class="part choose"><button id="choose-basic" type="button" data-plan="Basic" data-seats="seats-basic">Choose Basic</button></div>
    <div class="part choose"><button id="choose-pro" type="button" data-plan="Pro" data-seats="seats-pro">Choose Pro</button></div>
    <div class="part choose"><button id="choose-team" type="button" data-plan="Team" data-seats="seats-team">Choose Team</button></div>
  </div>
  <p id="plan-status" role="status"></p>
  <p><a href="#compare">Compare all plans</a></p>
</main>
<script>
  for (const button of document.querySelectorAll(".choose button")) {
    button.addEventListener("click", () => {
      const seats = document.getElementById(button.dataset.seats).value;
      document.getElementById("plan-status").textContent =
        `${button.dataset.plan} plan with ${seats} seats added to your order.`;
    });
  }
</script>
</body>
</html>
