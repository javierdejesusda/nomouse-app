<!doctype html>
<!--
  builder-made test page for NoMouse. Copyright (c) 2026 javierdejesusda.
  MIT License (see LICENSE at the repository root).
  Pattern: modal dialog, correct variant. Enter on "Edit address" shows the
  dialog and moves focus to its first field; the page behind is made inert.
  Escape closes the dialog and returns focus to "Edit address".
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your account (builder-made)</title>
<style>
  body { margin: 0; font: 16px/1.5 system-ui, sans-serif; color: #1d1d1f; background: #fafafa; }
  .badge { display: block; padding: 4px 16px; background: #fff3c4; border-bottom: 1px solid #e0c868; font-size: 14px; }
  header { display: flex; gap: 24px; align-items: center; padding: 12px 16px; background: #fff; border-bottom: 1px solid #ddd; }
  header strong { margin-right: auto; }
  main { padding: 16px; max-width: 720px; }
  .card { background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 16px; margin-bottom: 12px; }
  .card h2 { margin: 0 0 4px; font-size: 18px; }
  .card p { margin: 0 0 8px; }
  button { font: inherit; padding: 6px 12px; }
  input { font: inherit; padding: 6px 8px; }
  .scrim { position: fixed; inset: 0; background: rgba(20, 20, 30, .4); }
  [role="dialog"] { position: fixed; top: 100px; left: 50%; width: 420px; margin-left: -210px; padding: 24px; background: #fff; border-radius: 8px; box-sizing: border-box; }
  [role="dialog"] h2 { margin: 0 0 12px; font-size: 20px; }
  .field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
  .actions { display: flex; gap: 12px; justify-content: flex-end; }
  [hidden] { display: none; }
  :focus { outline: 2px solid #1a5fd0; outline-offset: 2px; }
</style>
</head>
<body>
<span class="badge">builder-made test page (MIT)</span>
<div id="page">
  <header>
    <strong>Corner bakery</strong>
    <a href="#orders">Orders</a>
    <a href="#account">Account</a>
  </header>
  <main id="account">
    <h1>Your account</h1>
    <div class="card">
      <h2>Delivery address</h2>
      <p>12 Mill Lane, Hebden Bridge</p>
      <button id="edit-address" type="button" aria-haspopup="dialog">Edit address</button>
    </div>
    <div class="card">
      <h2>Standing order</h2>
      <p>One sourdough loaf every Saturday.</p>
      <a href="#standing">Change standing order</a>
    </div>
  </main>
</div>
<div id="address-layer" hidden>
  <div class="scrim"></div>
  <div id="address-dialog" role="dialog" aria-modal="true" aria-labelledby="address-title">
    <h2 id="address-title">Edit delivery address</h2>
    <div class="field"><label for="address-street">Street</label><input id="address-street" value="12 Mill Lane"></div>
    <div class="field"><label for="address-town">Town</label><input id="address-town" value="Hebden Bridge"></div>
    <div class="actions">
      <button id="address-cancel" type="button">Cancel</button>
      <button id="address-save" type="button">Save</button>
    </div>
  </div>
</div>
<script>
  const trigger = document.getElementById("edit-address");
  const layer = document.getElementById("address-layer");
  const page = document.getElementById("page");
  function close() {
    layer.hidden = true;
    page.inert = false;
    trigger.focus();
  }
  trigger.addEventListener("click", () => {
    layer.hidden = false;
    page.inert = true;
    document.getElementById("address-street").focus();
  });
  document.getElementById("address-cancel").addEventListener("click", close);
  document.getElementById("address-save").addEventListener("click", close);
  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape" && !layer.hidden) {
      close();
    }
  });
</script>
</body>
</html>
