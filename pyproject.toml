[project]
name = "nomouse"
version = "0.1.0"
description = "Keyboard-only focus walks of web pages, with walker verdicts and model review."
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "javierdejesusda", email = "javier.dejesusj9@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pillow>=13.0.0",
    "playwright>=1.64.1",
]

[project.scripts]
nomouse = "nomouse.cli:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "D", "UP", "B", "SIM"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
markers = [
    "network: downloads from the internet; runs only with NOMOUSE_NETWORK_TESTS=1",
]
