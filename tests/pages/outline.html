<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Outline fixture</title>
<style>
  body { margin: 0; }
  input { position: absolute; left: 100px; width: 200px; height: 30px; }
  #ringed { top: 50px; }
  #bare { top: 300px; outline: none; }
</style>
</head>
<body>
<input id="ringed" aria-label="Ringed">
<input id="bare" aria-label="Bare">
</body>
</html>
