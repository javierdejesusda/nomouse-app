<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cover fixture</title>
<style>
  body { margin: 0; }
  #banner { position: fixed; left: 0; top: 0; width: 100%; height: 100px; background: #333; z-index: 1; }
  button { position: absolute; left: 100px; width: 120px; }
  #hidden { top: 20px; height: 40px; }
  #partly { top: 80px; height: 60px; }
  #clear { top: 300px; height: 40px; }
</style>
</head>
<body>
<div id="banner"></div>
<button id="hidden" type="button">Hidden</button>
<button id="partly" type="button">Partly</button>
<button id="clear" type="button"><span>Clear</span></button>
</body>
</html>
