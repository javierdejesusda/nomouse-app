<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Offset ring fixture</title>
<style>
  body { margin: 0; }
  input { position: absolute; left: 100px; top: 100px; width: 200px; height: 30px; }
  input:focus { outline: 2px solid blue; outline-offset: 4px; }
</style>
</head>
<body>
<input id="offset" aria-label="Offset">
</body>
</html>
